<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>tmpl2 Template Maker</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;background:#f3f4f6;color:#111827}
.app{min-height:100vh;display:grid;grid-template-columns:360px 1fr}.panel{background:#fff;border-right:1px solid #ddd;padding:22px;overflow:auto}.panel h1{font-size:20px;margin:0 0 4px}.sub{font-size:12px;color:#6b7280;margin-bottom:22px}
.group{border-top:1px solid #eee;padding:16px 0}.group h2{font-size:13px;margin:0 0 12px}label{display:block;font-size:12px;margin:10px 0 5px;color:#4b5563}input[type=text],textarea{width:100%;padding:9px;border:1px solid #d1d5db;border-radius:7px;font:inherit}textarea{min-height:70px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.color{display:flex;gap:8px;align-items:center}.color input[type=color]{width:42px;height:34px;border:0;background:none}
.check{display:flex;align-items:center;gap:8px;margin:9px 0;font-size:13px}.check input{margin:0}.actions{display:flex;gap:8px;margin-top:16px}.btn{border:0;border-radius:8px;padding:10px 12px;font-weight:600;cursor:pointer}.primary{background:#111827;color:#fff}.secondary{background:#e5e7eb}
.workspace{padding:24px;overflow:auto}.toolbar{display:flex;justify-content:center;gap:6px;margin-bottom:18px}.toolbar button{border:1px solid #d1d5db;background:#fff;border-radius:8px;padding:8px 14px;cursor:pointer}.toolbar button.active{background:#111827;color:#fff}
.device{margin:auto;background:#111;border-radius:28px;padding:10px;box-shadow:0 18px 45px #0002;transition:.25s;width:390px}.device.desktop{width:min(980px,100%);border-radius:16px}.screen{min-height:720px;border-radius:20px;overflow:hidden;background:#fff}.desktop .screen{border-radius:9px;min-height:650px}
.preview{min-height:720px;padding:18px 12px;text-align:center;transition:.2s}.desktop .preview{min-height:650px}.content{max-width:400px;margin:auto}.desktop .content{max-width:700px}
.logo{max-width:100%;max-height:90px;object-fit:contain;margin:5px auto 14px}.placeholder{border:1px dashed currentColor;border-radius:8px;padding:20px;opacity:.55;margin:8px 0 18px}
.tagrow{display:flex;gap:6px;margin:12px 0}.tagrow input{flex:1;min-width:0;padding:8px;border:1px solid #aaa;border-radius:5px}.tagrow button{border:0;border-radius:5px;padding:8px 10px}
.photo{margin:18px 0 26px}.photoimg{aspect-ratio:4/3;background:linear-gradient(135deg,#d1d5db,#9ca3af);display:grid;place-items:center;color:#fff;font-size:28px}.photo small{display:block;text-align:left;margin-bottom:5px}.icons{display:flex;justify-content:center;gap:16px;margin-top:10px;font-size:20px}.delete{margin:25px auto 5px;border:1px solid currentColor;background:transparent;color:inherit;border-radius:8px;padding:10px 18px}.note{font-size:11px;opacity:.65;margin-top:6px}
@media(max-width:800px){.app{grid-template-columns:1fr}.panel{border-right:0;border-bottom:1px solid #ddd}.workspace{padding:16px}.device{max-width:100%}}
</style>
</head>
<body>
<div class="app">
<aside class="panel">
<h1>tmpl2 Template Maker</h1><div class="sub">SPIXD template / v0.1</div>
<div class="group"><h2>基本デザイン</h2>
<div class="row"><div><label>背景色</label><div class="color"><input id="bg" type="color" value="#fefbf8"><span id="bgv">#fefbf8</span></div></div><div><label>文字色</label><div class="color"><input id="fg" type="color" value="#111111"><span id="fgv">#111111</span></div></div></div>
<label>タイトル画像 URL</label><input id="logo" type="text" placeholder="/images/group/title.png">
<label>タイトル</label><input id="title" type="text" value="MY Photo">
<label>説明文</label><textarea id="desc">撮影した写真をダウンロードできます。</textarea></div>
<div class="group"><h2>ハッシュタグ</h2>
<label>タグ</label><input id="tag" type="text" value="#SPIXD">
<label>コピーボタン文言</label><input id="copyText" type="text" value="タグをコピー">
<label class="check"><input id="showTag" type="checkbox" checked> ハッシュタグ欄を表示</label></div>
<div class="group"><h2>写真アクション</h2>
<label class="check"><input id="line" type="checkbox" checked> LINE</label>
<label class="check"><input id="x" type="checkbox" checked> X</label>
<label class="check"><input id="facebook" type="checkbox" checked> Facebook</label>
<label class="check"><input id="download" type="checkbox" checked> ダウンロード</label>
<label class="check"><input id="remove" type="checkbox" checked> 全削除ボタン</label></div>
<div class="actions"><button class="btn primary" id="generate">HTML生成</button><button class="btn secondary" id="reset">初期化</button></div>
</aside>
<main class="workspace">
<div class="toolbar"><button id="phone" class="active">📱 スマホ</button><button id="pc">🖥 PC</button></div>
<div id="device" class="device"><div class="screen"><div id="preview" class="preview"><div class="content">
<div id="logoBox" class="placeholder">TITLE IMAGE</div><h2 id="ptitle">MY Photo</h2><p id="pdesc">撮影した写真をダウンロードできます。</p>
<div id="tagBox" class="tagrow"><input id="ptag" readonly value="#SPIXD"><button id="pcopy">タグをコピー</button></div>
<div id="photos"></div><button id="pdelete" class="delete">ダウンロード後、写真を全削除</button><div class="note">Preview data / tmpl2の写真ループを想定</div>
</div></div></div></div>
</main></div>
<script>
const $=id=>document.getElementById(id);
const ids=["bg","fg","logo","title","desc","tag","copyText","showTag","line","x","facebook","download","remove"];
function icons(){return [["line","LINE"],["x","𝕏"],["facebook","f"],["download","⇩"]].filter(([id])=>$(id).checked).map(([,t])=>"<span>"+t+"</span>").join("")}
function photos(){return [1,2,3].map(n=>'<div class="photo"><small>Photo '+n+'</small><div class="photoimg">PHOTO</div><div class="icons">'+icons()+'</div></div>').join("")}
function render(){
 $("preview").style.background=$("bg").value;$("preview").style.color=$("fg").value;$("bgv").textContent=$("bg").value;$("fgv").textContent=$("fg").value;
 const url=$("logo").value.trim();$("logoBox").outerHTML=url?'<img id="logoBox" class="logo" src="'+url.replace(/"/g,"&quot;")+'" alt="title">':'<div id="logoBox" class="placeholder">TITLE IMAGE</div>';
 $("ptitle").textContent=$("title").value;$("pdesc").textContent=$("desc").value;$("ptag").value=$("tag").value;$("pcopy").textContent=$("copyText").value;$("tagBox").style.display=$("showTag").checked?"flex":"none";$("photos").innerHTML=photos();$("pdelete").style.display=$("remove").checked?"inline-block":"none";
}
ids.forEach(id=>$(id).addEventListener("input",render));
$("phone").onclick=()=>{$("device").classList.remove("desktop");$("phone").classList.add("active");$("pc").classList.remove("active")};
$("pc").onclick=()=>{$("device").classList.add("desktop");$("pc").classList.add("active");$("phone").classList.remove("active")};
$("reset").onclick=()=>location.reload();
$("generate").onclick=()=>{
 const action=[];if($("line").checked)action.push("LINE");if($("x").checked)action.push("X");if($("facebook").checked)action.push("Facebook");if($("download").checked)action.push("Download");
 const out='<!-- generated by tmpl2-template-maker -->\n<style>body{background:'+$("bg").value+';color:'+$("fg").value+'}</style>\n'+
 ($("logo").value?'<img src="'+$("logo").value+'" alt="MY Photo">\n':'')+'<h2>'+$("title").value+'</h2>\n<p>'+$("desc").value+'</p>\n'+
 ($("showTag").checked?'<input value="'+$("tag").value+'"><button>'+$("copyText").value+'</button>\n':'')+
 '<!-- tmpl:loop %LIST_PHOTO% -->\n<figure class="%COLUM%">\n<img src="/%SID%%FRAME%_p%MAXIMGSIZE%/%ID%.jpg" width="%WSIZE%" height="%HSIZE%">\n<!-- actions: '+action.join(", ")+' -->\n</figure>\n<!-- tmpl:endloop %LIST_PHOTO% -->';
 const blob=new Blob([out],{type:"text/html"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="spixd-template.html";a.click();URL.revokeObjectURL(a.href);
};
render();
</script>
</body></html>
