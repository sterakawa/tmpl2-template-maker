<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SPIXD Template Maker</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;background:#f3f4f6;color:#111827}.app{min-height:100vh;display:grid;grid-template-columns:370px 1fr}.panel{background:#fff;border-right:1px solid #ddd;padding:20px;overflow:auto}.panel h1{font-size:20px;margin:0}.sub{font-size:12px;color:#6b7280;margin:4px 0 18px}.group{border-top:1px solid #eee;padding:14px 0}.group h2{font-size:13px;margin:0 0 10px}label{display:block;font-size:12px;margin:9px 0 5px;color:#4b5563}input[type=text],input[type=number],select,textarea{width:100%;padding:8px;border:1px solid #d1d5db;border-radius:7px;font:inherit}.row{display:grid;grid-template-columns:1fr 1fr;gap:9px}.color{display:flex;gap:7px;align-items:center}.color input{width:42px;height:34px;border:0;background:none}.range{display:grid;grid-template-columns:1fr 55px;gap:8px;align-items:center}.range input[type=range]{width:100%}.check{display:flex;align-items:center;gap:7px;margin:8px 0;font-size:13px}.actions{display:flex;gap:8px}.btn{border:0;border-radius:8px;padding:10px 12px;font-weight:600;cursor:pointer}.primary{background:#111827;color:#fff}.secondary{background:#e5e7eb}
.workspace{padding:22px;overflow:auto}.toolbar{display:flex;justify-content:center;gap:6px;margin-bottom:16px}.toolbar button{border:1px solid #d1d5db;background:#fff;border-radius:8px;padding:8px 13px;cursor:pointer}.toolbar button.active{background:#111827;color:#fff}.device{margin:auto;background:#111;border-radius:28px;padding:10px;box-shadow:0 18px 45px #0002;width:390px;transition:.2s}.device.w430{width:430px}.device.desktop{width:min(980px,100%);border-radius:16px}.screen{min-height:720px;border-radius:20px;overflow:hidden;background:#fff}.desktop .screen{border-radius:9px}.preview{min-height:720px;text-align:center;padding:0 4px 30px}.titlewrap{width:100%;text-align:center}.titleimg{display:block;max-width:100%;height:auto;margin-left:auto;margin-right:auto}.placeholder{border:1px dashed currentColor;padding:25px;opacity:.45}.content{max-width:400px;margin:auto;padding:0 4px}.tagrow{display:flex;margin:0 auto 18px;max-width:390px}.tagrow input{flex:1;min-width:0;padding:8px;border:1px solid #aaa}.tagrow button{padding:8px;border:1px solid #aaa;background:transparent;color:inherit}.photo{margin:16px auto 25px;max-width:600px}.photo small{display:block;text-align:left;margin:0 0 4px 5px}.photoimg{width:100%;background:#ddd;object-fit:cover;display:block}.icons{display:flex;justify-content:flex-end;gap:10px;margin-top:8px}.icons img{width:34px;height:34px}.delete{margin:20px auto;border:1px solid currentColor;background:transparent;color:inherit;padding:9px 14px}.note{font-size:11px;opacity:.55}.desktop .content{max-width:700px}.desktop .photo{max-width:600px}@media(max-width:820px){.app{grid-template-columns:1fr}.panel{border-right:0;border-bottom:1px solid #ddd}.workspace{padding:12px}.device{max-width:100%}}
</style></head>
<body><div class="app"><aside class="panel"><h1>SPIXD Template Maker</h1><div class="sub">実SPIXDレイアウト基準 / v0.2</div>
<div class="group"><h2>案件プリセット</h2><select id="preset"><option value="standard">SPIXD 標準</option><option value="patek">ダーク背景サンプル</option><option value="ycp">横写真サンプル</option></select></div>
<div class="group"><h2>タイトル画像・余白</h2><label>タイトル画像ファイル名</label><div style="display:flex;align-items:center;gap:6px"><span style="font-size:12px;color:#6b7280;white-space:nowrap">/images/group/</span><input id="logoFile" type="text" value="spixd.png"></div>
<div id="logoPath" style="font-size:11px;color:#6b7280;margin-top:5px">生成パス: /images/group/spixd.png</div>
<label>プレビュー用画像URL <span style="color:#9ca3af">（確認用）</span></label><input id="logo" type="text" value="https://spixd.com/images/group/spixd.png">
<label>タイトル幅</label><div class="range"><input id="logoWidth" type="range" min="100" max="800" value="300"><input id="logoWidthN" type="number" min="100" max="800" value="300"></div>
<label>上余白</label><div class="range"><input id="topSpace" type="range" min="0" max="120" value="5"><input id="topSpaceN" type="number" min="0" max="120" value="5"></div>
<label>タイトル下余白</label><div class="range"><input id="bottomSpace" type="range" min="0" max="120" value="14"><input id="bottomSpaceN" type="number" min="0" max="120" value="14"></div></div>
<div class="group"><h2>基本デザイン</h2><div class="row"><div><label>背景色</label><div class="color"><input id="bg" type="color" value="#ffffff"><span id="bgv">#ffffff</span></div></div><div><label>文字色</label><div class="color"><input id="fg" type="color" value="#111111"><span id="fgv">#111111</span></div></div></div>
<label>ハッシュタグ</label><input id="tag" type="text" value="#SPIXD"><label>ボタン文言</label><input id="copyText" type="text" value="タグをコピー"></div>
<div class="group"><h2>写真表示</h2><label>写真の向き</label><select id="orientation"><option value="v">縦</option><option value="h">横</option></select><label>写真最大幅</label><div class="range"><input id="photoWidth" type="range" min="280" max="700" value="400"><input id="photoWidthN" type="number" min="280" max="700" value="400"></div></div>
<div class="group"><h2>アイコン</h2><select id="iconset"><option value="normal">標準</option><option value="b">ダーク背景用</option></select><label class="check"><input id="instagram" type="checkbox"> Instagram</label><label class="check"><input id="line" type="checkbox" checked> LINE</label><label class="check"><input id="x" type="checkbox" checked> X</label><label class="check"><input id="facebook" type="checkbox" checked> Facebook</label><label class="check"><input id="download" type="checkbox" checked> Download</label><label class="check"><input id="remove" type="checkbox" checked> 全削除</label></div>
<div class="actions"><button class="btn primary" id="generate">HTML生成</button><button class="btn secondary" id="reset">初期化</button></div></aside>
<main class="workspace"><div class="toolbar"><button data-mode="phone" class="active">390px</button><button data-mode="w430">430px</button><button data-mode="desktop">PC</button></div><div id="device" class="device"><div class="screen"><div id="preview" class="preview"><div id="titlewrap" class="titlewrap"><img id="logoImg" class="titleimg"></div><div class="content"><div class="tagrow"><input id="ptag" readonly><button id="pcopy"></button></div><div id="photos"></div><button id="pdelete" class="delete">ダウンロード後、写真を全削除</button><div class="note">実SPIXD素材を参照したレイアウトプレビュー</div></div></div></div></div></main></div>
<script>
const $=id=>document.getElementById(id);
const iconBase="https://spixd.com/images/spixd/";
const presets={standard:{file:"spixd.png",logo:"https://spixd.com/images/group/spixd.png",lw:300,top:5,bottom:14,bg:"#ffffff",fg:"#111111",tag:"#SPIXD",ori:"v",pw:400,set:"normal",inst:false},patek:{file:"patekphiippe.png",logo:"https://spixd.com/images/group/patekphiippe.png",lw:600,top:0,bottom:32,bg:"#001138",fg:"#ffffff",tag:"#patekphilippe #cubitus",ori:"v",pw:400,set:"b",inst:false},ycp:{file:"ycp2026.png",logo:"https://spixd.com/images/group/ycp2026.png",lw:600,top:0,bottom:12,bg:"#ffffff",fg:"#111111",tag:"#YCP",ori:"h",pw:600,set:"normal",inst:true}};
const pairs=[["logoWidth","logoWidthN"],["topSpace","topSpaceN"],["bottomSpace","bottomSpaceN"],["photoWidth","photoWidthN"]];
pairs.forEach(([a,b])=>{[a,b].forEach(id=>$(id).addEventListener("input",()=>{ $(id===a?b:a).value=$(id).value;render()}))});
function icon(name){const set=$("iconset").value;let file=name;if(name==="x")file="x";if(set==="b"&&name!=="instagram")file+="_b";return '<img src="'+iconBase+file+'.svg" alt="'+name+'">'}
function renderPhotos(){let arr=[];if($("instagram").checked)arr.push("instagram");if($("line").checked)arr.push("line");if($("x").checked)arr.push("x");if($("facebook").checked)arr.push("facebook");if($("download").checked)arr.push("dl");let h=$("orientation").value==="h"?"240px":"520px";return [1,2].map(n=>'<div class="photo" style="max-width:'+$("photoWidth").value+'px"><small>'+n+'</small><img class="photoimg" style="height:'+h+'" src="https://spixd.com/'+($("orientation").value==="h"?"R3JY-VSOT_p2000/"+n+".jpg":"DFQP-EOIH_pf2_p800/"+n+".jpg")+'"><div class="icons">'+arr.map(icon).join("")+'</div></div>').join("")}
function render(){const file=$("logoFile").value.trim().replace(/^\/+|.*\//g,"");$("logoPath").textContent="生成パス: /images/group/"+file;const p=$("preview");p.style.background=$("bg").value;p.style.color=$("fg").value;$("bgv").textContent=$("bg").value;$("fgv").textContent=$("fg").value;const im=$("logoImg");im.src=$("logo").value;im.style.width=$("logoWidth").value+"px";$("titlewrap").style.paddingTop=$("topSpace").value+"px";$("titlewrap").style.marginBottom=$("bottomSpace").value+"px";$("ptag").value=$("tag").value;$("pcopy").textContent=$("copyText").value;$("photos").innerHTML=renderPhotos();$("pdelete").style.display=$("remove").checked?"inline-block":"none"}
["logoFile","logo","bg","fg","tag","copyText","orientation","iconset","instagram","line","x","facebook","download","remove"].forEach(id=>$(id).addEventListener("input",render));
$("preset").onchange=()=>{const p=presets[$("preset").value];$("logoFile").value=p.file;$("logo").value=p.logo;$("logoWidth").value=$("logoWidthN").value=p.lw;$("topSpace").value=$("topSpaceN").value=p.top;$("bottomSpace").value=$("bottomSpaceN").value=p.bottom;$("bg").value=p.bg;$("fg").value=p.fg;$("tag").value=p.tag;$("orientation").value=p.ori;$("photoWidth").value=$("photoWidthN").value=p.pw;$("iconset").value=p.set;$("instagram").checked=p.inst;render()};
document.querySelectorAll(".toolbar button").forEach(b=>b.onclick=()=>{document.querySelectorAll(".toolbar button").forEach(x=>x.classList.remove("active"));b.classList.add("active");$("device").className="device"+(b.dataset.mode==="phone"?"":" "+b.dataset.mode)});
$("reset").onclick=()=>location.reload();
$("generate").onclick=()=>{const out='<!-- generated by tmpl2-template-maker v0.2 -->\n<style>body{background:'+$("bg").value+';color:'+$("fg").value+'}#titleimg{text-align:center;padding-top:'+$("topSpace").value+'px;margin-bottom:'+$("bottomSpace").value+'px}#titleimg img{width:'+$("logoWidth").value+'px;max-width:100%;height:auto}.figurecontainer figure{max-width:'+$("photoWidth").value+'px;margin-left:auto;margin-right:auto}</style>\n<div id="titleimg"><img src="'+$("logo").value+'" alt="MY Photo"></div>\n<div id="contentContainer"><input id="foo" value="'+$("tag").value+'"><button class="btn">'+$("copyText").value+'</button></div>\n<!-- tmpl:loop %LIST_PHOTO% -->\n<figure class="%COLUM%"><p class="photonumber">%ID%</p><img src="/%SID%%FRAME%_p%MAXIMGSIZE%/%ID%.jpg" width="%WSIZE%" height="%HSIZE%"></figure>\n<!-- tmpl:endloop %LIST_PHOTO% -->';const blob=new Blob([out],{type:"text/html"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="spixd-template.html";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
render();
</script></body></html>
